name: endlessnet_client_ui
description: "Интерфейс установленной службы EndlessNet Client."
publish_to: 'none'
version: 0.11.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  endlessnet_ui:
    git:
      url: https://github.com/endless-net/client-ui.git
      ref: 3ed642208795a967c1699d829dd5528b9294dd06
      path: packages/endlessnet_ui
  crypto: 3.0.8
  ffi: 2.2.0
  grpc: 5.1.0
  http2: 2.3.1
  protobuf: 6.0.0
  endlessnet_client_api:
    git:
      url: https://github.com/endless-net/client.git
      ref: a50e997641466d504a216083cf7ddd9aeab6a755 # api/v0.8.0
      path: api/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spaces/
