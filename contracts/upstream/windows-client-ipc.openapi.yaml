# Status: active
# Owner: client
openapi: 3.1.0
info:
  title: EndlessNet Client Local Service IPC
  version: 1.0.0
  description: >
    Versioned local IPC contract between the EndlessNet background service and
    unprivileged client UI processes. The HTTP shape is transported over a
    protected local channel; it is not a network listener.
servers:
  - url: http://endlessnet.local
    description: Placeholder authority used by local IPC clients.
x-endlessnet-transports:
  - platform: windows
    kind: windows_named_pipe
    endpoint: "\\\\.\\pipe\\endlessnet-service"
    default: true
  - platform: linux
    kind: unix_socket
    endpoint: "/run/endlessnet/client.sock"
  - platform: macos
    kind: unix_socket
    endpoint: "/var/run/endlessnet/client.sock"
paths:
  /status:
    get:
      operationId: status
      summary: Read current service state.
      responses:
        "200":
          description: Current service-visible state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /events:
    get:
      operationId: events
      summary: Stream service events as newline-delimited JSON.
      description: >
        The service sends a hello event first, then a status_changed event for
        the current status, then additional status_changed events only when the
        service-visible status changes. Clients should reconnect after EOF.
      x-ndjson: true
      responses:
        "200":
          description: Newline-delimited ServiceEvent values.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ServiceEvent"
        default:
          $ref: "#/components/responses/IPCError"
  /enroll:
    post:
      operationId: enroll
      summary: Enroll this device using a one-time token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrollment accepted and local state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /connect:
    post:
      operationId: connect
      summary: Clear local disconnect intent and bring the tunnel up.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Connect command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /server-identity:
    get:
      operationId: server_identity
      summary: Compare the pinned and currently announced server signing identities.
      responses:
        "200":
          description: Server signing identity comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerIdentityResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /server-identity/trust:
    post:
      operationId: server_identity.trust
      summary: Explicitly trust a confirmed server signing identity, recover the node credential, and connect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustServerRequest"
      responses:
        "200":
          description: Trust recovery and connection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /disconnect:
    post:
      operationId: disconnect
      summary: Persist local disconnect intent and bring the tunnel down.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Disconnect command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /logout:
    post:
      operationId: logout
      summary: Revoke/remove local enrollment and clear generated tunnel state.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Logout command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /networks:
    get:
      operationId: networks
      summary: List service-visible networks for this enrollment.
      responses:
        "200":
          description: Networks known to the local service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworksResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /network/select:
    post:
      operationId: network.select
      summary: Select the already-enrolled network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectNetworkRequest"
      responses:
        "200":
          description: Selected network result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /diagnostics:
    get:
      operationId: diagnostics
      summary: Produce a redacted diagnostics bundle.
      responses:
        "200":
          description: Redacted diagnostics summary and optional bundle path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsResponse"
        default:
          $ref: "#/components/responses/IPCError"
  /logs/recent:
    get:
      operationId: logs.recent
      summary: Read recent redacted service log entries.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Recent service logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsRecentResponse"
        default:
          $ref: "#/components/responses/IPCError"
components:
  responses:
    IPCError:
      description: Stable JSON IPC error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TrustServerRequest:
      type: object
      additionalProperties: false
      required:
        - confirmed
        - confirmed_key_id
      properties:
        confirmed:
          type: boolean
          const: true
        confirmed_key_id:
          type: string
          minLength: 1
    ServerIdentityResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - server_url
            - trusted_key_id
            - announced_key_id
            - changed
          properties:
            server_url:
              type: string
              format: uri
            trusted_key_id:
              type: string
            announced_key_id:
              type: string
            changed:
              type: boolean
    ProtocolEnvelope:
      type: object
      required:
        - ipc_protocol
        - ipc_version
        - ipc_min_supported_version
      properties:
        ipc_protocol:
          type: string
          const: endlessnet-client-ipc
        ipc_version:
          type: integer
          const: 1
        ipc_min_supported_version:
          type: integer
          const: 1
        service_version:
          type: string
        service_commit:
          type: string
        service_build_date:
          type: string
    ServiceState:
      type: string
      enum:
        - Connected
        - Disconnected
        - Connecting
        - Updating
        - Degraded
        - Error
        - NeedsEnrollment
        - NeedsApproval
        - ServerIdentityChanged
    ControlState:
      type: string
      enum:
        - connecting
        - updating
        - syncing
        - needs_approval
        - approval_required
        - pending_approval
        - degraded
        - offline_cache
        - ready
        - registered
        - cache_invalid
        - error
        - not_registered
        - disconnected
        - server_identity_changed
    DesiredState:
      type: string
      enum:
        - connected
        - disconnected
    ConnectionIntent:
      type: object
      required:
        - desired_state
      properties:
        desired_state:
          $ref: "#/components/schemas/DesiredState"
        reason:
          type: string
        updated_at:
          type: string
          format: date-time
    StatusResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
            - control_state
            - desired_state
            - cached_map_present
            - cached_map_valid
            - node_credential_present
            - private_key_present
          properties:
            state:
              $ref: "#/components/schemas/ServiceState"
            control_state:
              $ref: "#/components/schemas/ControlState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            user_disconnected:
              type: boolean
            connection_intent:
              $ref: "#/components/schemas/ConnectionIntent"
            server_url:
              type: string
            server_urls:
              type: array
              items:
                type: string
            account_id:
              type: string
            node_id:
              type: string
            hostname:
              type: string
            network_id:
              type: string
            network_name:
              type: string
            enrollment_request_id:
              type: string
            enrollment_approval_url:
              type: string
              format: uri
            approval_url:
              type: string
              format: uri
            overlay_ip:
              type: string
            overlay_ipv6:
              type: string
            overlay_cidr:
              type: string
            overlay_ipv6_cidr:
              type: string
            map_revision:
              type: integer
              minimum: 0
            peer_count:
              type: integer
              minimum: 0
            cached_map_present:
              type: boolean
            cached_map_valid:
              type: boolean
            node_credential_present:
              type: boolean
            private_key_present:
              type: boolean
            agent:
              type: object
              additionalProperties: true
            control:
              type: object
              additionalProperties: true
    CommandResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - state
          properties:
            ok:
              type: boolean
            state:
              $ref: "#/components/schemas/ServiceState"
            desired_state:
              $ref: "#/components/schemas/DesiredState"
            user_disconnected:
              type: boolean
            enrolled:
              type: boolean
            enrollment_pending:
              type: boolean
            enrollment_request_id:
              type: string
            enrollment_approval_url:
              type: string
              format: uri
            approval_url:
              type: string
              format: uri
            node_id:
              type: string
            network_id:
              type: string
            selected_network_id:
              type: string
            map_revision:
              type: integer
              minimum: 0
          additionalProperties: true
    EnrollRequest:
      type: object
      properties:
        enroll_token:
          type: string
          minLength: 1
          writeOnly: true
        join_token:
          type: string
          minLength: 1
          writeOnly: true
        server:
          type: string
        server_url:
          type: string
        mode:
          type: string
          enum:
            - workstation
            - server
            - subnet-router
            - interactive
        hostname:
          type: string
        idempotency_key:
          type: string
    SelectNetworkRequest:
      type: object
      properties:
        network_id:
          type: string
        network_name:
          type: string
      anyOf:
        - required:
            - network_id
        - required:
            - network_name
    NetworkSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cidr:
          type: string
        ipv6_cidr:
          type: string
        account_id:
          type: string
      additionalProperties: true
    NetworksResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - networks
            - selected_network_id
          properties:
            networks:
              type: array
              items:
                $ref: "#/components/schemas/NetworkSummary"
            selected_network_id:
              type: string
    DiagnosticsResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          properties:
            generated_at:
              type: string
              format: date-time
            bundle_path:
              type: string
            status:
              $ref: "#/components/schemas/StatusResponse"
            recent_logs:
              type: array
              items:
                $ref: "#/components/schemas/LogEntry"
          additionalProperties: true
    LogsRecentResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          properties:
            logs:
              type: array
              items:
                $ref: "#/components/schemas/LogEntry"
            entries:
              type: array
              items:
                $ref: "#/components/schemas/LogEntry"
    LogEntry:
      type: object
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
        message:
          type: string
    ServiceEvent:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - event_type
            - sequence
            - generated_at
          properties:
            event_type:
              type: string
              enum:
                - hello
                - status_changed
                - error
            sequence:
              type: integer
              minimum: 1
            generated_at:
              type: string
              format: date-time
            status:
              $ref: "#/components/schemas/StatusResponse"
            error_code:
              $ref: "#/components/schemas/ErrorCode"
            error:
              type: string
    ErrorCode:
      type: string
      enum:
        - invalid_json
        - method_not_allowed
        - not_implemented
        - not_found
        - request_too_large
        - request_failed
        - unauthorized
        - network_ref_required
        - config_unavailable
        - network_map_unavailable
        - node_identity_missing
        - device_fingerprint_mismatch
        - wireguard_output_required
        - wireguard_read_failed
        - wireguard_render_failed
        - wireguard_write_failed
        - connect_failed
        - disconnect_failed
        - logout_failed
        - diagnostics_bundle_failed
        - connection_intent_update_failed
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required:
            - ok
            - error_code
            - error
          properties:
            ok:
              type: boolean
              const: false
            error_code:
              $ref: "#/components/schemas/ErrorCode"
            error:
              type: string
