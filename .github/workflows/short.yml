name: Client UI short

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false
      - name: Check test policy and trace structure
        run: |
          node --test scripts/check-contract-workflows.test.mjs scripts/check-client-coverage.test.mjs
          node scripts/check-client-coverage.mjs
      - name: Short Go tests
        run: go test -short ./...
      - name: Short Linux notification protocol unit tests
        run: |
          if ! pkg-config --exists gio-2.0; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y libglib2.0-dev
          fi
          mkdir -p app/.dart_tool
          c++ -std=c++14 -Wall -Werror app/linux/runner/notification_protocol_test.cc $(pkg-config --cflags --libs gio-2.0) -o app/.dart_tool/notification_protocol_test
          app/.dart_tool/notification_protocol_test
          c++ -std=c++17 -Wall -Werror app/linux/runner/tray_host_protocol_test.cc $(pkg-config --cflags --libs gio-2.0) -o app/.dart_tool/tray_host_protocol_test
          app/.dart_tool/tray_host_protocol_test
      - name: Resolve locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Short Flutter unit and widget tests
        working-directory: app
        run: flutter test --no-pub --tags short
      - name: Reject dependency drift
        run: git diff --exit-code -- app/pubspec.yaml app/pubspec.lock
