name: Mobile v0 consumer

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Passes per OS (3 for release preparation or flake diagnosis)'
        type: choice
        options: ['1', '3']
        default: '1'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (pass ${{ matrix.pass }})
    strategy:
      fail-fast: false
      matrix:
        pass: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.repetitions == '3' && '[1,2,3]' || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false
      - name: Generate Android test host
        working-directory: tests/mobile_contract
        run: flutter create --platforms=android --project-name=endlessnet_contract_harness --no-pub .
      - name: Resolve test-host dependencies
        working-directory: tests/mobile_contract
        run: flutter pub get
      - name: Reject product or harness manifest drift
        run: git diff --exit-code -- app/pubspec.yaml app/pubspec.lock tests/mobile_contract/pubspec.yaml
      - name: Verify existing emulator acceleration access
        shell: bash
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::Runner lacks usable KVM access. Runner-owner approval is required to change host permissions; software emulation is not acceptance evidence.'
            exit 1
          fi
      - name: Run contract widget in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on
          script: cd tests/mobile_contract && flutter test integration_test/contract_test.dart -d emulator-5554 --no-pub

  ios:
    name: iOS (pass ${{ matrix.pass }})
    strategy:
      fail-fast: false
      matrix:
        pass: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.repetitions == '3' && '[1,2,3]' || '[1]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false
      - name: Generate iOS test host
        working-directory: tests/mobile_contract
        run: flutter create --platforms=ios --project-name=endlessnet_contract_harness --no-pub .
      - name: Resolve test-host dependencies
        working-directory: tests/mobile_contract
        run: flutter pub get
      - name: Reject product or harness manifest drift
        run: git diff --exit-code -- app/pubspec.yaml app/pubspec.lock tests/mobile_contract/pubspec.yaml
      - name: Run contract widget in iOS simulator
        shell: bash
        working-directory: tests/mobile_contract
        run: |
          set -euo pipefail
          read -r device state <<< "$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[v for k,vs in d["devices"].items() if ".iOS-" in k for v in vs if v["name"].startswith("iPhone")]; assert a, "No available iPhone simulator"; print(a[0]["udid"], a[0]["state"])')"
          finish_simulator() {
            result=$?
            if [ "$result" -ne 0 ]; then
              # This is the isolated synthetic contract host, never a signed-in
              # product session. Collect before shutdown; preserve test failure.
              mkdir -p diagnostics
              xcrun simctl io "$device" screenshot diagnostics/simulator.png || true
              xcrun simctl spawn "$device" log show --last 5m --style compact \
                --predicate 'process == "Runner"' > diagnostics/runner.log 2>&1 || true
            fi
            if [ "$state" != Booted ]; then
              xcrun simctl shutdown "$device" || true
            fi
            return "$result"
          }
          trap finish_simulator EXIT
          if [ "$state" != Booted ]; then
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
          flutter test integration_test/contract_test.dart -d "$device" --no-pub --verbose
      - name: Preserve synthetic simulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-contract-failure-${{ github.run_id }}-pass-${{ matrix.pass }}
          path: tests/mobile_contract/diagnostics/
          if-no-files-found: warn
          retention-days: 3
