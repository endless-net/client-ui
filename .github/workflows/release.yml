name: Release Windows client

on:
  repository_dispatch:
    types: [backend-client-core-published]

permissions:
  contents: write

concurrency:
  group: windows-client-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    environment: release
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.client_payload.version }}
      BACKEND_COMMIT: ${{ github.event.client_payload.backend_commit }}
      CORE_MANIFEST_URL: ${{ github.event.client_payload.manifest_url }}
      CORE_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate dispatch and enforce idempotency
        id: idempotency
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "invalid release version" }
          if ($env:BACKEND_COMMIT -notmatch '^[a-fA-F0-9]{40}$') { throw "backend commit must be a full SHA" }
          if ($env:CORE_MANIFEST_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw "manifest digest is invalid" }
          $tag = "v$env:VERSION"
          gh release view $tag --repo unng-lab/endlessnet-client-ui *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingDir = Join-Path $env:RUNNER_TEMP "existing-release"
            New-Item -ItemType Directory -Path $existingDir -Force | Out-Null
            gh release download $tag --repo unng-lab/endlessnet-client-ui --pattern release-provenance.json --dir $existingDir
            if ($LASTEXITCODE -ne 0) { throw "release $tag exists without provenance" }
            $existing = Get-Content (Join-Path $existingDir "release-provenance.json") -Raw | ConvertFrom-Json
            if ($existing.backend.manifest_sha256 -ne $env:CORE_MANIFEST_SHA256.ToLowerInvariant()) {
              throw "release $tag already exists for a different core manifest"
            }
            "noop=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "noop=false" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        if: steps.idempotency.outputs.noop != 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: subosito/flutter-action@v2
        if: steps.idempotency.outputs.noop != 'true'
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: true

      - name: Install pinned WiX Toolset
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add --global WixToolset.Util.wixext/5.0.0
          wix extension add --global WixToolset.UI.wixext/5.0.0

      - name: Test sources
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          go test ./tools/windows-packaging/...
          Push-Location app
          try {
            flutter pub get
            flutter analyze
            flutter test
          } finally {
            Pop-Location
          }

      - name: Resolve immutable Go core
        if: steps.idempotency.outputs.noop != 'true'
        env:
          BACKEND_RELEASE_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
        shell: pwsh
        run: >-
          ./scripts/resolve-client-core.ps1
          -ManifestUrl $env:CORE_MANIFEST_URL
          -ManifestSHA256 $env:CORE_MANIFEST_SHA256
          -Version $env:VERSION
          -BackendCommit $env:BACKEND_COMMIT
          -OutputDir "$env:RUNNER_TEMP/client-core"
          -GitHubToken $env:BACKEND_RELEASE_TOKEN

      - name: Test UI against released IPC contract
        if: steps.idempotency.outputs.noop != 'true'
        env:
          ENDLESSNET_IPC_OPENAPI: ${{ runner.temp }}/client-core/windows-client-ipc.openapi.yaml
        working-directory: app
        run: flutter test test/ui_contract_e2e_test.dart

      - name: Import release signing certificate
        if: steps.idempotency.outputs.noop != 'true'
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw "signing certificate is not configured" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) { throw "failed to import signing certificate" }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe was not found" }
          "ENDLESSNET_CODESIGN_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "SIGNTOOL_EXE=$($signTool.FullName)" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Build and sign release candidate
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: >-
          ./scripts/build-windows-client-msi.ps1
          -Version $env:VERSION
          -ClientExe "$env:RUNNER_TEMP/client-core/endlessnet-client_windows_amd64.exe"
          -OutputDir "$env:RUNNER_TEMP/release"
          -Sign

      - name: Verify Authenticode
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $paths = @(
            "$env:RUNNER_TEMP/release/endlessnet-client.exe",
            "$env:RUNNER_TEMP/release/tray/endlessnet-tray.exe",
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:VERSION.msi"
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") { throw "invalid Authenticode signature for ${path}: $($signature.Status)" }
          }

      - name: Download previous MSI when available
        if: steps.idempotency.outputs.noop != 'true'
        id: previous
        shell: pwsh
        run: |
          $previous = gh release list --repo unng-lab/endlessnet-client-ui --limit 100 --json tagName,isDraft --jq ".[] | select(.isDraft == false) | .tagName" | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previous) -or $previous -eq "v$env:VERSION") {
            "path=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "previous"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $previous --repo unng-lab/endlessnet-client-ui --pattern "EndlessNet.Client.*.msi" --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "failed to download previous MSI $previous" }
          $path = (Get-ChildItem $dir -Filter "*.msi" | Select-Object -First 1).FullName
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Exercise install, repair, upgrade and uninstall
        if: steps.idempotency.outputs.noop != 'true'
        env:
          ENDLESSNET_E2E_WINDOWS_MSI: "1"
          ENDLESSNET_E2E_WINDOWS_MSI_PATH: ${{ runner.temp }}/release/EndlessNet.Client.${{ github.event.client_payload.version }}.msi
          ENDLESSNET_E2E_WINDOWS_PREVIOUS_MSI_PATH: ${{ steps.previous.outputs.path }}
        run: go test -tags e2e ./tests -run TestWindowsClientMSIInstallUpgradeUninstall -count=1 -timeout 20m

      - name: Test Flutter against installed Go service
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:VERSION.msi"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with $($install.ExitCode)" }
          try {
            $env:ENDLESSNET_TRAY_LIVE_PIPE_TEST = "1"
            Push-Location app
            try { flutter test test/named_pipe_live_test.dart } finally { Pop-Location }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with $($uninstall.ExitCode)" }
          }

      - name: Assemble release provenance
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP/release/tray/*" -DestinationPath "$env:RUNNER_TEMP/release/endlessnet-tray_windows_amd64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/release/winget/*" -DestinationPath "$env:RUNNER_TEMP/release/winget-manifests.zip"
          ./scripts/write-release-provenance.ps1 `
            -CoreManifest "$env:RUNNER_TEMP/client-core/client-core-manifest.json" `
            -CoreManifestUrl $env:CORE_MANIFEST_URL `
            -CoreManifestSHA256 $env:CORE_MANIFEST_SHA256 `
            -BuildOutput "$env:RUNNER_TEMP/release/build-output.json" `
            -Output "$env:RUNNER_TEMP/release/release-provenance.json"

      - name: Publish private GitHub Release
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag `
            --repo unng-lab/endlessnet-client-ui `
            --target $env:GITHUB_SHA `
            --title "EndlessNet Client $tag" `
            --notes "Automated signed Windows client release from backend $env:BACKEND_COMMIT." `
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:VERSION.msi" `
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:VERSION.msi.sha256" `
            "$env:RUNNER_TEMP/release/endlessnet-client.exe" `
            "$env:RUNNER_TEMP/release/endlessnet-tray_windows_amd64.zip" `
            "$env:RUNNER_TEMP/release/winget-manifests.zip" `
            "$env:RUNNER_TEMP/release/release-provenance.json"

      - name: Dispatch public mirror
        if: steps.idempotency.outputs.noop != 'true'
        env:
          FRONT_RELEASE_TOKEN: ${{ secrets.FRONT_RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $releaseDir = "$env:RUNNER_TEMP/release"
          $msi = Join-Path $releaseDir "EndlessNet.Client.$env:VERSION.msi"
          $checksum = "$msi.sha256"
          $provenance = Join-Path $releaseDir "release-provenance.json"
          $body = @{
            event_type = "windows-client-ui-published"
            client_payload = @{
              version = $env:VERSION
              tag = "v$env:VERSION"
              ui_commit = $env:GITHUB_SHA
              backend_commit = $env:BACKEND_COMMIT
              release_repository = "unng-lab/endlessnet-client-ui"
              msi_asset = [IO.Path]::GetFileName($msi)
              msi_sha256 = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
              checksum_asset = [IO.Path]::GetFileName($checksum)
              checksum_sha256 = (Get-FileHash -Algorithm SHA256 $checksum).Hash.ToLowerInvariant()
              provenance_asset = [IO.Path]::GetFileName($provenance)
              provenance_sha256 = (Get-FileHash -Algorithm SHA256 $provenance).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/unng-lab/endlessnetfront/dispatches" `
            -Headers @{ Authorization = "Bearer $env:FRONT_RELEASE_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" } `
            -ContentType "application/json" `
            -Body $body
