name: Release Windows client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-client-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    environment: release
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_CODESIGN_MODE: ${{ vars.WINDOWS_CODESIGN_MODE || 'temporary-self-signed' }}
      WINDOWS_CODESIGN_EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_EXPECTED_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve independent UI version
        id: ui-version
        shell: pwsh
        run: ./scripts/resolve-ui-version.ps1

      - name: Validate UI release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -cne "v$env:UI_VERSION") {
            throw "release tag must exactly match app/pubspec.yaml UI version"
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add --global WixToolset.Util.wixext/5.0.0
          wix extension add --global WixToolset.UI.wixext/5.0.0

      - name: Resolve reviewed public client core
        id: core
        shell: pwsh
        run: >-
          ./scripts/resolve-client-core.ps1
          -OutputDir "$env:RUNNER_TEMP/client-core"

      - name: Validate tag idempotency
        id: idempotency
        shell: pwsh
        run: >-
          ./scripts/resolve-release-idempotency.ps1
          -UIVersion $env:UI_VERSION
          -CoreVersion $env:CORE_VERSION
          -ClientCommit $env:CLIENT_COMMIT
          -CoreManifestSHA256 $env:CORE_MANIFEST_SHA256

      - name: Prepare Flutter dependencies
        if: steps.idempotency.outputs.noop != 'true'
        working-directory: app
        run: flutter pub get

      - name: Validate dependency licenses
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: >-
          ./scripts/check-dependency-licenses.ps1
          -Output "$env:RUNNER_TEMP/dependency-licenses.json"

      - name: Test sources
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          go test ./...
          Push-Location app
          try {
            flutter analyze
            flutter test
          } finally {
            Pop-Location
          }

      - name: Test UI against released IPC contract
        if: steps.idempotency.outputs.noop != 'true'
        env:
          ENDLESSNET_IPC_OPENAPI: ${{ steps.core.outputs.ipc_contract }}
        working-directory: app
        run: flutter test test/ui_contract_e2e_test.dart

      - uses: anchore/sbom-action@v0
        if: steps.idempotency.outputs.noop != 'true'
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/ui-source-sbom.spdx.json

      - name: Import release signing certificate
        if: steps.idempotency.outputs.noop != 'true'
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        shell: pwsh
        run: ./scripts/import-release-signing-certificate.ps1

      - name: Record temporary self-signed signing notice
        if: >-
          steps.idempotency.outputs.noop != 'true' &&
          env.WINDOWS_CODESIGN_MODE == 'temporary-self-signed'
        shell: pwsh
        run: |
          @"
          ## Temporary self-signed Authenticode

          This release uses the stable temporary self-signed certificate configured in the
          protected `release` environment. It provides neither public Windows trust nor
          Microsoft SmartScreen reputation. The job verifies signature integrity and the exact
          signer without adding a trusted root, then removes the certificate and private key.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Build and sign release candidate
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: >-
          ./scripts/build-windows-client-msi.ps1
          -UIVersion $env:UI_VERSION
          -CoreVersion $env:CORE_VERSION
          -ClientExe "${{ steps.core.outputs.client_exe }}"
          -RecoveryHelperExe "${{ steps.core.outputs.recovery_helper_exe }}"
          -CoreMetadataDir "$env:RUNNER_TEMP/client-core"
          -UISourceSBOM "$env:RUNNER_TEMP/ui-source-sbom.spdx.json"
          -OutputDir "$env:RUNNER_TEMP/release"
          -SigningMode $env:WINDOWS_CODESIGN_MODE
          -Sign

      - name: Verify Authenticode
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $endlessNetPaths = @(
            "$env:RUNNER_TEMP/release/endlessnet-client.exe",
            "$env:RUNNER_TEMP/release/endlessnet-client-recovery-helper.exe",
            "$env:RUNNER_TEMP/release/app/endlessnet.exe",
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi"
          )
          foreach ($path in $endlessNetPaths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            $allowedStatuses = if ($env:WINDOWS_CODESIGN_MODE -eq "temporary-self-signed") {
              @("Valid", "NotTrusted", "UnknownError")
            } else {
              @("Valid")
            }
            if ($signature.Status -notin $allowedStatuses) {
              throw "invalid Authenticode signature for ${path}: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:ENDLESSNET_CODESIGN_THUMBPRINT) {
              throw "unexpected Authenticode signer for $path"
            }
          }
          $wintunSignature = Get-AuthenticodeSignature -LiteralPath "$env:RUNNER_TEMP/release/wintun.dll"
          if ($wintunSignature.Status -ne "Valid") {
            throw "invalid official Wintun Authenticode signature: $($wintunSignature.Status)"
          }
          if ($wintunSignature.SignerCertificate.Thumbprint -eq $env:ENDLESSNET_CODESIGN_THUMBPRINT) {
            throw "official Wintun signature was replaced by the EndlessNet release signer"
          }

      - name: Verify compliance files inside release MSI
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: >-
          ./scripts/test-windows-distribution-compliance.ps1
          -DistributionDir "$env:RUNNER_TEMP/release"
          -Msi "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi"

      - name: Download previous MSI when available
        if: steps.idempotency.outputs.noop != 'true'
        id: previous
        shell: pwsh
        run: |
          $previous = gh release list --repo endless-net/client-ui --limit 100 --json tagName,isDraft --jq ".[] | select(.isDraft == false) | .tagName" | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previous) -or $previous -eq "v$env:UI_VERSION") {
            "path=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "previous"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $previous --repo endless-net/client-ui --pattern "EndlessNet.Client.*.msi" --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "failed to download previous MSI $previous" }
          $path = (Get-ChildItem $dir -Filter "*.msi" | Select-Object -First 1).FullName
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Exercise install, repair, upgrade and uninstall
        if: steps.idempotency.outputs.noop != 'true'
        env:
          ENDLESSNET_E2E_WINDOWS_MSI: "1"
          ENDLESSNET_E2E_WINDOWS_PREVIOUS_MSI_PATH: ${{ steps.previous.outputs.path }}
        shell: pwsh
        run: |
          $env:ENDLESSNET_E2E_WINDOWS_MSI_PATH = "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi"
          go test -tags e2e ./tests -run TestWindowsClientMSIInstallUpgradeUninstall -count=1 -timeout 20m

      - name: Test Flutter against installed Go service
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with $($install.ExitCode)" }
          try {
            $env:ENDLESSNET_LIVE_PIPE_TEST = "1"
            Push-Location app
            try { flutter test test/named_pipe_live_test.dart } finally { Pop-Location }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with $($uninstall.ExitCode)" }
          }

      - name: Prepare installed distribution for SBOM
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP/release"
          $target = "$env:RUNNER_TEMP/distribution-sbom-input"
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item "$source/app" "$target/app" -Recurse
          foreach ($name in @(
            "endlessnet-client.exe",
            "wintun.dll",
            "wintun-LICENSE.txt",
            "EndlessNet.Client.$env:UI_VERSION.msi"
          )) {
            Copy-Item (Join-Path $source $name) (Join-Path $target $name)
          }

      - uses: anchore/sbom-action@v0
        if: steps.idempotency.outputs.noop != 'true'
        with:
          path: ${{ runner.temp }}/distribution-sbom-input
          format: spdx-json
          output-file: ${{ runner.temp }}/release/windows-distribution-sbom.spdx.json

      - name: Assemble release metadata
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP/release/app/*" -DestinationPath "$env:RUNNER_TEMP/release/endlessnet_windows_amd64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/release/winget/*" -DestinationPath "$env:RUNNER_TEMP/release/winget-manifests.zip"
          Copy-Item "$env:RUNNER_TEMP/ui-source-sbom.spdx.json" "$env:RUNNER_TEMP/release/endlessnet-client-ui-source-sbom.spdx.json"
          Copy-Item "${{ steps.core.outputs.source_sbom }}" "$env:RUNNER_TEMP/release/endlessnet-client-source-sbom.spdx.json"
          Copy-Item "$env:RUNNER_TEMP/dependency-licenses.json" "$env:RUNNER_TEMP/release/dependency-licenses.json"
          ./scripts/write-release-provenance.ps1 `
            -CoreManifest "${{ steps.core.outputs.manifest }}" `
            -CoreManifestUrl $env:CORE_MANIFEST_URL `
            -CoreManifestSHA256 $env:CORE_MANIFEST_SHA256 `
            -CoreLock ./client-core.lock.json `
            -BuildOutput "$env:RUNNER_TEMP/release/build-output.json" `
            -UISourceSBOM "$env:RUNNER_TEMP/release/endlessnet-client-ui-source-sbom.spdx.json" `
            -DistributionSBOM "$env:RUNNER_TEMP/release/windows-distribution-sbom.spdx.json" `
            -Output "$env:RUNNER_TEMP/release/release-provenance.json"

      - uses: actions/attest-build-provenance@v4
        if: steps.idempotency.outputs.noop != 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/release/EndlessNet.Client.*.msi
            ${{ runner.temp }}/release/endlessnet_windows_amd64.zip
            ${{ runner.temp }}/release/*-sbom.spdx.json

      - name: Publish public GitHub Release
        if: steps.idempotency.outputs.noop != 'true'
        shell: pwsh
        run: |
          $tag = "v$env:UI_VERSION"
          $signingNotice = if ($env:WINDOWS_CODESIGN_MODE -eq "temporary-self-signed") {
            "TEMPORARY SIGNING NOTICE: EndlessNet artifacts use a stable self-signed Authenticode certificate. This does not provide public Windows trust or Microsoft SmartScreen reputation."
          } else {
            "EndlessNet artifacts use the configured publicly trusted Authenticode certificate."
          }
          gh release create $tag `
            --repo endless-net/client-ui `
            --target $env:GITHUB_SHA `
            --title "EndlessNet Client $tag" `
            --notes "Automated signed Windows UI $env:UI_VERSION with client core $env:CORE_VERSION ($env:CLIENT_COMMIT).`n`n$signingNotice" `
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi" `
            "$env:RUNNER_TEMP/release/EndlessNet.Client.$env:UI_VERSION.msi.sha256" `
            "$env:RUNNER_TEMP/release/endlessnet-client.exe" `
            "$env:RUNNER_TEMP/release/wintun.dll" `
            "$env:RUNNER_TEMP/release/wintun-LICENSE.txt" `
            "$env:RUNNER_TEMP/release/endlessnet_windows_amd64.zip" `
            "$env:RUNNER_TEMP/release/winget-manifests.zip" `
            "$env:RUNNER_TEMP/release/dependency-licenses.json" `
            "$env:RUNNER_TEMP/release/endlessnet-client-ui-source-sbom.spdx.json" `
            "$env:RUNNER_TEMP/release/endlessnet-client-source-sbom.spdx.json" `
            "$env:RUNNER_TEMP/release/windows-distribution-sbom.spdx.json" `
            "$env:RUNNER_TEMP/release/release-provenance.json"

      - name: Remove release signing certificate and private key
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/remove-release-signing-certificate.ps1
