name: Go tooling CI
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install pinned Go check tools
        run: bash scripts/install-ci-tools.sh
      - name: Go tests, vulnerability scan and lint
        run: |
          go test -short ./...
          govulncheck ./...
          golangci-lint run --config .golangci-lint.yaml ./... --timeout 1m
