name: Client v0 consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot-unit:
    name: v0 snapshot unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false
      - name: Resolve exact consumer dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Test generated v0 snapshot consumer
        working-directory: app
        run: flutter test --no-pub test/client_runtime_snapshot_test.dart
      - name: Reject dependency drift
        run: git diff --exit-code -- app/pubspec.yaml app/pubspec.lock
