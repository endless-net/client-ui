name: Client v0 consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot-unit:
    name: v0 snapshot unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: endless-net/client
          ref: a5d7be8e8ec7468a7fe4754818827f976b39addf
          path: client-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: client-source/clientipc/go.mod
          cache: false
      - name: Build pinned producer scenario host
        shell: bash
        working-directory: client-source/clientipc
        run: go build -o "$GITHUB_WORKSPACE/client-testserver.exe" ./cmd/client-testserver
      - name: Resolve exact consumer dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Test generated v0 snapshot consumer
        working-directory: app
        env:
          ENDLESSNET_TESTSERVER: ${{ github.workspace }}/client-testserver.exe
        run: flutter test --no-pub test/client_runtime_snapshot_test.dart test/client_event_stream_test.dart test/local_client_events_test.dart
      - name: Reject dependency drift
        run: git diff --exit-code -- app/pubspec.yaml app/pubspec.lock
