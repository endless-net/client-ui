name: CI

on:
  push:
    branches: ['**']
    tags: ['v0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify baseline
        shell: bash
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - name: Static and tooling unit checks
        run: python3 -B scripts/ci.py check
      - name: Shared Flutter library unit checks
        run: python3 -B scripts/check_ui_library.py

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: windows-amd64
            runner: windows-2022
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned WiX for the Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix" wix --version 7.0.0
          "$env:RUNNER_TEMP/wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Windows update signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/check-windows-update-proof.ps1
      - name: Native desktop archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci.py build --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: client-ui-${{ matrix.target }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: [checks, build]
    runs-on: windows-2022
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source is on main
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: client-ui-*
          merge-multiple: true
          path: .artifacts
      - name: Import EndlessNet release signing key
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: ./scripts/import-release-signing-certificate.ps1
      - name: Publish exact checked tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci.py publish
