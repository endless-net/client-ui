name: CI

on:
  push:
    branches: ['**']
    tags: ['v0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify baseline
        shell: bash
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - name: Static and tooling unit checks
        run: python3 -B scripts/ci.py check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: windows-amd64
            runner: windows-2022
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Native desktop archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python -B scripts/ci.py build --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: client-ui-${{ matrix.target }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: [checks, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-ui-*
          merge-multiple: true
          path: .artifacts
      - name: Publish exact checked tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci.py publish
