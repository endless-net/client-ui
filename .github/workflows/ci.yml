name: Client UI CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve independent UI version
        shell: pwsh
        run: ./scripts/resolve-ui-version.ps1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: false

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add --global WixToolset.Util.wixext/5.0.0
          wix extension add --global WixToolset.UI.wixext/5.0.0

      - name: Resolve reviewed public client core
        id: core
        shell: pwsh
        run: >-
          ./scripts/resolve-client-core.ps1
          -OutputDir "$env:RUNNER_TEMP/client-core"

      - name: Prepare Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate dependency licenses
        shell: pwsh
        run: >-
          ./scripts/check-dependency-licenses.ps1
          -Output "$env:RUNNER_TEMP/dependency-licenses.json"

      - name: Test Go tools
        run: go test ./...

      - name: Build service emulator
        shell: pwsh
        run: >-
          go build
          -o "$env:RUNNER_TEMP/endlessnet-service-emulator.exe"
          ./tools/service-emulator/cmd/endlessnet-service-emulator

      - name: Analyze and test Flutter UI
        working-directory: app
        env:
          ENDLESSNET_SERVICE_EMULATOR: ${{ runner.temp }}\endlessnet-service-emulator.exe
        run: |
          flutter analyze
          flutter test

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/ui-source-sbom.spdx.json

      - name: Build unsigned packaging-smoke MSI
        shell: pwsh
        run: >-
          ./scripts/build-windows-client-msi.ps1
          -UIVersion $env:UI_VERSION
          -CoreVersion $env:CORE_VERSION
          -ClientExe "${{ steps.core.outputs.client_exe }}"
          -RecoveryHelperExe "${{ steps.core.outputs.recovery_helper_exe }}"
          -CoreMetadataDir "$env:RUNNER_TEMP/client-core"
          -UISourceSBOM "$env:RUNNER_TEMP/ui-source-sbom.spdx.json"
          -OutputDir "$env:RUNNER_TEMP/windows-client-msi"

      - name: Reject accidental signatures in CI artifact
        shell: pwsh
        run: |
          $msi = Get-Item "$env:RUNNER_TEMP/windows-client-msi/EndlessNet.Client.$env:UI_VERSION.msi"
          if ((Get-AuthenticodeSignature -LiteralPath $msi.FullName).Status -ne "NotSigned") {
            throw "CI MSI must be unsigned"
          }

      - name: Verify compliance files inside packaging-smoke MSI
        shell: pwsh
        run: >-
          ./scripts/test-windows-distribution-compliance.ps1
          -DistributionDir "$env:RUNNER_TEMP/windows-client-msi"
          -Msi "$env:RUNNER_TEMP/windows-client-msi/EndlessNet.Client.$env:UI_VERSION.msi"

      - name: Exercise unsigned install, repair and uninstall
        env:
          ENDLESSNET_E2E_WINDOWS_MSI: "1"
        shell: pwsh
        run: |
          $env:ENDLESSNET_E2E_WINDOWS_MSI_PATH = "$env:RUNNER_TEMP/windows-client-msi/EndlessNet.Client.$env:UI_VERSION.msi"
          go test -tags e2e ./tests -run TestWindowsClientMSIInstallUpgradeUninstall -count=1 -timeout 20m

      - name: Upload unsigned packaging-smoke MSI
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-msi-packaging-smoke
          path: |
            ${{ runner.temp }}/windows-client-msi/EndlessNet.Client.*.msi
            ${{ runner.temp }}/windows-client-msi/EndlessNet.Client.*.msi.sha256
            ${{ runner.temp }}/dependency-licenses.json
          if-no-files-found: error
          retention-days: 7
